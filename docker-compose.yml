# Local development dependencies for developers who have Docker available.
# Equivalent to `npm run db:up` (scripts/pg.sh), which needs neither Docker nor root.
# When using this file, set DATABASE_URL / TEST_DATABASE_URL to port 5432.
services:
  db:
    image: postgres:17-alpine
    container_name: examprep-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: examprep
      POSTGRES_PASSWORD: examprep
      POSTGRES_DB: examprep
    ports:
      - '5432:5432'
    volumes:
      - examprep-pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init-test-db.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U examprep -d examprep']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  examprep-pgdata:
